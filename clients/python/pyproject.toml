[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sg"
version = "0.4.2"
description = "StationGod's verbs from Python, through the hub: the sg package and the run_script worker."
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[tool.setuptools]
packages = ["sg"]

[tool.setuptools.package-data]
sg = ["*.pyi", "py.typed"]
